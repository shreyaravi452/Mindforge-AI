<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debate Arena</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            background-image: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            color: white; min-height: 100vh; overflow: hidden;
        }
        #root { width: 100%; height: 100vh; }
        .setup-container { max-width: 1200px; margin: 0 auto; padding: 60px 50px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .logo { text-align: center; margin-bottom: 60px; }
        .logo h1 { font-size: 3.2em; font-weight: 200; letter-spacing: 4px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 15px; }
        .logo p { color: #888; font-size: 1em; font-weight: 300; }
        .form-group { margin-bottom: 35px; }
        label { display: block; margin-bottom: 12px; font-size: 0.75em; color: #999; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; }
        input[type="text"], select { width: 100%; padding: 18px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 16px; transition: all 0.3s; }
        input[type="text"]::placeholder { color: #666; font-size: 15px; }
        input[type="text"]:focus, select:focus { outline: none; border-color: #667eea; background: rgba(255,255,255,0.08); box-shadow: 0 0 20px rgba(102,126,234,0.2); }
        select { cursor: pointer; }
        select option { background: #1a1a2e; color: white; }
        .personality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .gender-toggle { display: flex; gap: 10px; margin-top: 12px; }
        .gender-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #aaa; font-size: 14px; cursor: pointer; transition: all 0.3s; }
        .gender-btn.active { background: rgba(102,126,234,0.2); border-color: #667eea; color: #667eea; }
        .gender-btn:hover { background: rgba(255,255,255,0.08); }
        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }
        button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102,126,234,0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .voice-clone-section { margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; }
        .voice-clone-label { font-size: 0.7em; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
        .voice-clone-buttons { display: flex; gap: 10px; }
        .voice-clone-btn { flex: 1; padding: 12px; background: rgba(102,126,234,0.1); border: 1px solid rgba(102,126,234,0.3); border-radius: 8px; color: #667eea; font-size: 13px; cursor: pointer; transition: all 0.3s; text-transform: none; letter-spacing: 0; margin: 0; }
        .voice-clone-btn:hover:not(:disabled) { background: rgba(102,126,234,0.2); transform: translateY(-1px); box-shadow: 0 5px 15px rgba(102,126,234,0.2); }
        .voice-clone-btn.recording { background: rgba(255,68,68,0.2); border-color: rgba(255,68,68,0.5); color: #ff6b6b; animation: pulse 1s ease-in-out infinite; }
        .voice-clone-btn.cloned { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); color: #22c55e; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .voice-status { font-size: 0.75em; color: #22c55e; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
        .voice-status::before { content: "✓"; font-weight: bold; }
        .error { background: rgba(255,68,68,0.2); border: 1px solid rgba(255,68,68,0.4); color: #ff6b6b; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9em; }
        .debate-container { height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .debate-header { text-align: center; padding: 30px 20px; z-index: 10; }
        .debate-topic { font-size: 1.3em; font-weight: 300; color: #fff; margin-bottom: 10px; }
        .debate-status { font-size: 0.85em; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .debate-arena { flex: 1; display: flex; align-items: center; justify-content: space-around; padding: 0 50px; position: relative; }
        .debater { display: flex; flex-direction: column; align-items: center; position: relative; transition: all 0.3s ease; }
        .silhouette-container { position: relative; width: 280px; height: 320px; margin-bottom: 30px; }
        .silhouette { width: 100%; height: 100%; transition: all 0.5s ease; filter: drop-shadow(0 15px 40px rgba(0,0,0,0.4)); overflow: visible; }
        .silhouette .sil-fill { fill: rgba(255,255,255,0.13); transition: fill 0.5s ease; }
        .debater:first-child .silhouette { transform: scaleX(-1); }
        .debater.speaking .silhouette { filter: drop-shadow(0 0 40px rgba(102,126,234,0.8)) drop-shadow(0 0 80px rgba(102,126,234,0.4)); animation: speaking-pulse 1.5s ease-in-out infinite; }
        .debater.speaking .silhouette .sil-fill { fill: url(#gradient1); }
        .debater:first-child.speaking .silhouette { animation: speaking-pulse-mirror 1.5s ease-in-out infinite; }
        .debater:nth-child(3).speaking .silhouette { filter: drop-shadow(0 0 40px rgba(118,75,162,0.8)) drop-shadow(0 0 80px rgba(118,75,162,0.4)); animation: speaking-pulse 1.5s ease-in-out infinite; }
        .debater:nth-child(3).speaking .silhouette .sil-fill { fill: url(#gradient2); }
        @keyframes speaking-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes speaking-pulse-mirror { 0%, 100% { transform: scaleX(-1) scale(1); } 50% { transform: scaleX(-1) scale(1.03); } }
        .audio-viz { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; height: 50px; align-items: flex-end; opacity: 0; transition: opacity 0.3s; }
        .debater.speaking .audio-viz { opacity: 1; }
        .audio-bar { width: 5px; background: linear-gradient(to top, #667eea, #764ba2); border-radius: 3px; animation: audio-bounce 0.6s ease-in-out infinite; }
        .audio-bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; }
        .audio-bar:nth-child(4) { animation-delay: 0.3s; }
        .audio-bar:nth-child(5) { animation-delay: 0.4s; }
        .audio-bar:nth-child(6) { animation-delay: 0.3s; }
        .audio-bar:nth-child(7) { animation-delay: 0.2s; }
        .audio-bar:nth-child(8) { animation-delay: 0.1s; }
        .audio-bar:nth-child(9) { animation-delay: 0s; }
        @keyframes audio-bounce { 0%, 100% { height: 12px; } 50% { height: 45px; } }
        .debater-info { text-align: center; }
        .debater-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 5px; }
        .debater.speaking .debater-label { color: #667eea; }
        .debater-personality { font-size: 1em; font-weight: 300; color: #aaa; }
        .debater.speaking .debater-personality { color: #fff; }
        .debater-position { font-size: 0.9em; font-weight: 600; margin-top: 5px; color: #888; }
        .debater.speaking .debater-position { color: #764ba2; }
        .search-notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(102,126,234,0.15); border: 1px solid rgba(102,126,234,0.4); padding: 12px 24px; border-radius: 10px; color: #667eea; font-size: 0.85em; z-index: 100; animation: slideDown 0.3s ease-out; max-width: 600px; text-align: center; }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        .stop-button { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 14px 32px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; z-index: 100; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 4px 15px rgba(239,68,68,0.3); }
        .stop-button:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 6px 20px rgba(239,68,68,0.5); }
        .round-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; }
        .round-text { font-size: 0.9em; color: #666; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        .round-number { font-size: 3em; font-weight: 200; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .voting-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        .voting-title { font-size: 2.5em; font-weight: 200; margin-bottom: 15px; text-align: center; }
        .voting-subtitle { font-size: 1.1em; color: #888; margin-bottom: 50px; text-align: center; }
        .vote-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 800px; width: 100%; }
        .vote-button { padding: 50px 30px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; cursor: pointer; transition: all 0.3s; }
        .vote-button:hover { background: rgba(255,255,255,0.1); border-color: #667eea; transform: translateY(-5px); box-shadow: 0 20px 50px rgba(102,126,234,0.3); }
        .vote-debater { font-size: 1.5em; font-weight: 600; margin-bottom: 10px; }
        .vote-personality { font-size: 1em; color: #aaa; margin-bottom: 8px; }
        .vote-position { font-size: 0.85em; color: #667eea; text-transform: uppercase; letter-spacing: 2px; }
        .results-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .winner-announcement { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 60px; border-radius: 20px; margin-bottom: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .winner-title { font-size: 3em; font-weight: 200; margin-bottom: 20px; }
        .winner-personality { font-size: 1.3em; margin-bottom: 10px; opacity: 0.9; }
        .winner-position { font-size: 1.1em; opacity: 0.8; text-transform: uppercase; letter-spacing: 2px; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .bg-circle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(102,126,234,0.1), transparent); animation: float 20s infinite ease-in-out; }
        .bg-circle:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s; }
        .bg-circle:nth-child(2) { width: 200px; height: 200px; top: 60%; right: 10%; animation-delay: 5s; }
        .bg-circle:nth-child(3) { width: 250px; height: 250px; bottom: 10%; left: 50%; animation-delay: 10s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(50px, -50px); } 66% { transform: translate(-50px, 50px); } }
    </style>
</head>

        function App() {
            const [screen, setScreen] = useState('setup');
            const [topic, setTopic] = useState('');
            const [personality1, setPersonality1] = useState(Object.keys(PERSONALITY_NAMES)[0]);
            const [personality2, setPersonality2] = useState(Object.keys(PERSONALITY_NAMES)[1]);
            const [gender1, setGender1] = useState('male');
            const [gender2, setGender2] = useState('female');
            const [name1, setName1] = useState('');
            const [name2, setName2] = useState('');
            const [voiceId1, setVoiceId1] = useState(null);
            const [voiceId2, setVoiceId2] = useState(null);
            const [recording1, setRecording1] = useState(false);
            const [recording2, setRecording2] = useState(false);
            const [ws, setWs] = useState(null);
            const [status, setStatus] = useState('');
            const [currentRound, setCurrentRound] = useState(0);
            const [activeDebater, setActiveDebater] = useState(null);
            const [searchNotification, setSearchNotification] = useState(null);
            const [winner, setWinner] = useState(null);
            const [error, setError] = useState('');

            const mediaRecorderRef1 = useRef(null);
            const mediaRecorderRef2 = useRef(null);
            const audioChunksRef1 = useRef([]);
            const audioChunksRef2 = useRef([]);

            const audioRef = useRef(null);
            const audioQueueRef = useRef([]);
            const isPlayingRef = useRef(false);
            const searchTimeoutRef = useRef(null);

            const playNextAudio = () => {
                if (isPlayingRef.current || audioQueueRef.current.length === 0) return;
                isPlayingRef.current = true;
                const { audio, debater } = audioQueueRef.current.shift();
                setActiveDebater(debater);
                const binaryString = window.atob(audio);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const audioBlob = new Blob([bytes], { type: 'audio/mpeg' });
                const audioUrl = URL.createObjectURL(audioBlob);
                if (audioRef.current) {
                    audioRef.current.src = audioUrl;
                    audioRef.current.play().catch(() => {
                        isPlayingRef.current = false;
                        setActiveDebater(null);
                        playNextAudio();
                    });
                }
            };

            const handleAudioEnded = () => {
                isPlayingRef.current = false;
                setActiveDebater(null);
                playNextAudio();
            };

            const showSearchNotification = (debaterName, query) => {
                // Clear any existing timeout
                if (searchTimeoutRef.current) {
                    clearTimeout(searchTimeoutRef.current);
                }

                setSearchNotification({ debaterName, query });

                // Auto-hide after 4 seconds
                searchTimeoutRef.current = setTimeout(() => {
                    setSearchNotification(null);
                }, 4000);
            };

            const stopDebate = () => {
                // Stop any playing audio
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                }

                // Clear audio queue
                audioQueueRef.current = [];
                isPlayingRef.current = false;
                setActiveDebater(null);

                // Close WebSocket
                if (ws) {
                    ws.close();
                    setWs(null);
                }

                // Show voting screen
                setScreen('voting');
            };

            const startRecording = async (debater) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    const chunks = debater === 1 ? audioChunksRef1 : audioChunksRef2;
                    chunks.current = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) chunks.current.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(chunks.current, { type: 'audio/webm' });
                        await uploadVoice(audioBlob, debater);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    if (debater === 1) {
                        mediaRecorderRef1.current = mediaRecorder;
                        setRecording1(true);
                    } else {
                        mediaRecorderRef2.current = mediaRecorder;
                        setRecording2(true);
                    }

                    mediaRecorder.start();
                } catch (err) {
                    setError('Microphone access denied');
                }
            };

            const stopRecording = (debater) => {
                const recorder = debater === 1 ? mediaRecorderRef1.current : mediaRecorderRef2.current;
                if (recorder && recorder.state !== 'inactive') {
                    recorder.stop();
                    if (debater === 1) setRecording1(false);
                    else setRecording2(false);
                }
            };

            const uploadVoice = async (audioBlob, debater) => {
                try {
                    const customName = debater === 1 ? name1 : name2;
                    const personality = debater === 1 ? personality1 : personality2;
                    const gender = debater === 1 ? gender1 : gender2;
                    const defaultName = PERSONALITY_NAMES[personality][gender];
                    const voiceName = customName || defaultName;

                    const formData = new FormData();
                    formData.append('name', voiceName);
                    formData.append('audio', audioBlob, 'recording.webm');

                    const response = await fetch('http://localhost:8000/api/clone-voice', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    if (result.success) {
                        if (debater === 1) setVoiceId1(result.voice_id);
                        else setVoiceId2(result.voice_id);
                    } else {
                        setError(`Voice cloning failed: ${result.error}`);
                    }
                } catch (err) {
                    setError('Failed to upload voice');
                }
            };

            const startDebate = () => {
                if (!topic.trim()) {
                    setError('Please enter a debate topic');
                    return;
                }
                setError('');
                setScreen('debate');
                setStatus('Connecting...');
                const websocket = new WebSocket('ws://localhost:8000/ws/debate');
                websocket.onopen = () => {
                    setStatus('Connected! Starting debate...');
                    const config = {
                        topic,
                        personality1,
                        personality2,
                        gender1,
                        gender2
                    };
                    if (name1) config.name1 = name1;
                    if (name2) config.name2 = name2;
                    if (voiceId1) config.voice_id1 = voiceId1;
                    if (voiceId2) config.voice_id2 = voiceId2;
                    websocket.send(JSON.stringify(config));
                };
                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'status') setStatus(data.message);
                    else if (data.type === 'round_start') setCurrentRound(data.round_number);
                    else if (data.type === 'argument') {
                        // Show search notification if this argument used web search
                        if (data.used_search && data.search_query) {
                            showSearchNotification(data.name, data.search_query);
                        }
                    }
                    else if (data.type === 'audio') {
                        audioQueueRef.current.push({ audio: data.audio, debater: data.debater });
                        playNextAudio();
                    }
                    else if (data.type === 'debate_complete') {
                        setStatus('Debate complete!');
                        setTimeout(() => setScreen('voting'), 2000);
                    }
                    else if (data.type === 'error') setError(data.message);
                };
                websocket.onerror = () => setError('Connection error');
                websocket.onclose = () => setStatus('Connection closed');
                setWs(websocket);
            };

            const castVote = (debater) => {
                setWinner(debater);
                setScreen('results');
                if (ws) ws.close();
            };

            const resetDebate = () => {
                setScreen('setup');
                setTopic('');
                setName1('');
                setName2('');
                setGender1('male');
                setGender2('female');
                setVoiceId1(null);
                setVoiceId2(null);
                setCurrentRound(0);
                setActiveDebater(null);
                setSearchNotification(null);
                setWinner(null);
                setError('');
                audioQueueRef.current = [];
                isPlayingRef.current = false;
                if (searchTimeoutRef.current) {
                    clearTimeout(searchTimeoutRef.current);
                }
            };

            useEffect(() => {
                return () => {
                    if (ws) ws.close();
                };
            }, [ws]);

            if (screen === 'setup') {
                return (
                    <div className="setup-container">
                        <div className="logo">
                            <h1>DEBATE ARENA</h1>
                            <p>AI Voice Debates</p>
                        </div>
                        {error && <div className="error">{error}</div>}
                        <div className="form-group">
                            <label>Debate Topic</label>
                            <input type="text" placeholder="Enter the debate topic (e.g., 'Should AI replace human creativity?')" value={topic} onChange={(e) => setTopic(e.target.value)} />
                        </div>
                        <div className="personality-grid">
                            <div className="form-group">
                                <label>Debater 1 - FOR</label>
                                <input type="text" placeholder={`Custom name (default: ${PERSONALITY_NAMES[personality1][gender1]})`} value={name1} onChange={(e) => setName1(e.target.value)} />
                                <div className="gender-toggle">
                                    <button className={`gender-btn ${gender1 === 'male' ? 'active' : ''}`} onClick={() => setGender1('male')}>Male</button>
                                    <button className={`gender-btn ${gender1 === 'female' ? 'active' : ''}`} onClick={() => setGender1('female')}>Female</button>
                                </div>
                                <select value={personality1} onChange={(e) => setPersonality1(e.target.value)} style={{ marginTop: '15px' }}>
                                    {Object.keys(PERSONALITY_NAMES).map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                                <div className="voice-clone-section">
                                    <div className="voice-clone-label">Custom Voice (Optional)</div>
                                    <div className="voice-clone-buttons">
                                        <button
                                            className={`voice-clone-btn ${recording1 ? 'recording' : ''} ${voiceId1 ? 'cloned' : ''}`}
                                            onClick={() => recording1 ? stopRecording(1) : startRecording(1)}
                                            disabled={voiceId1 !== null}
                                        >
                                            {recording1 ? '⏹ Stop Recording' : voiceId1 ? '✓ Voice Cloned' : '🎤 Record Voice'}
                                        </button>
                                    </div>
                                    {voiceId1 && <div className="voice-status">Voice cloned successfully</div>}
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Debater 2 - AGAINST</label>
                                <input type="text" placeholder={`Custom name (default: ${PERSONALITY_NAMES[personality2][gender2]})`} value={name2} onChange={(e) => setName2(e.target.value)} />
                                <div className="gender-toggle">
                                    <button className={`gender-btn ${gender2 === 'male' ? 'active' : ''}`} onClick={() => setGender2('male')}>Male</button>
                                    <button className={`gender-btn ${gender2 === 'female' ? 'active' : ''}`} onClick={() => setGender2('female')}>Female</button>
                                </div>
                                <select value={personality2} onChange={(e) => setPersonality2(e.target.value)} style={{ marginTop: '15px' }}>
                                    {Object.keys(PERSONALITY_NAMES).map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                                <div className="voice-clone-section">
                                    <div className="voice-clone-label">Custom Voice (Optional)</div>
                                    <div className="voice-clone-buttons">
                                        <button
                                            className={`voice-clone-btn ${recording2 ? 'recording' : ''} ${voiceId2 ? 'cloned' : ''}`}
                                            onClick={() => recording2 ? stopRecording(2) : startRecording(2)}
                                            disabled={voiceId2 !== null}
                                        >
                                            {recording2 ? '⏹ Stop Recording' : voiceId2 ? '✓ Voice Cloned' : '🎤 Record Voice'}
                                        </button>
                                    </div>
                                    {voiceId2 && <div className="voice-status">Voice cloned successfully</div>}
                                </div>
                            </div>
                        </div>
                        <button onClick={startDebate}>Start Debate</button>
                    </div>
                );
            }

            if (screen === 'debate') {
                const displayName1 = name1 || PERSONALITY_NAMES[personality1][gender1];
                const displayName2 = name2 || PERSONALITY_NAMES[personality2][gender2];

                return (
                    <div className="debate-container">
                        <div className="debate-header">
                            <div className="debate-topic">{topic}</div>
                            <div className="debate-status">{status}</div>
                        </div>
                        {searchNotification && (
                            <div className="search-notification">
                                🔍 {searchNotification.debaterName} looked up: {searchNotification.query}
                            </div>
                        )}
                        <div className="debate-arena">
                            <div className={`debater ${activeDebater === 1 ? 'speaking' : ''}`}>
                                <div className="silhouette-container">
                                    <Silhouette gradient="gradient1" />
                                    <AudioVisualization />
                                </div>
                                <div className="debater-info">
                                    <div className="debater-label">{displayName1}</div>
                                    <div className="debater-personality">{personality1}</div>
                                    <div className="debater-position">FOR</div>
                                </div>
                            </div>
                            {currentRound > 0 && (
                                <div className="round-indicator">
                                    <div className="round-text">Round</div>
                                    <div className="round-number">{currentRound}</div>
                                </div>
                            )}
                            <div className={`debater ${activeDebater === 2 ? 'speaking' : ''}`}>
                                <div className="silhouette-container">
                                    <Silhouette gradient="gradient2" />
                                    <AudioVisualization />
                                </div>
                                <div className="debater-info">
                                    <div className="debater-label">{displayName2}</div>
                                    <div className="debater-personality">{personality2}</div>
                                    <div className="debater-position">AGAINST</div>
                                </div>
                            </div>
                        </div>
                        <button className="stop-button" onClick={stopDebate}>Stop Debate</button>
                        <audio ref={audioRef} onEnded={handleAudioEnded} style={{ display: 'none' }} />
                    </div>
                );
            }

            if (screen === 'voting') {
                const displayName1 = name1 || PERSONALITY_NAMES[personality1][gender1];
                const displayName2 = name2 || PERSONALITY_NAMES[personality2][gender2];

                return (
                    <div className="voting-container">
                        <h1 className="voting-title">Debate Complete</h1>
                        <p className="voting-subtitle">Who won?</p>
                        <div className="vote-buttons">
                            <button className="vote-button" onClick={() => castVote(1)}>
                                <div className="vote-debater">{displayName1}</div>
                                <div className="vote-personality">{personality1}</div>
                                <div className="vote-position">FOR</div>
                            </button>
                            <button className="vote-button" onClick={() => castVote(2)}>
                                <div className="vote-debater">{displayName2}</div>
                                <div className="vote-personality">{personality2}</div>
                                <div className="vote-position">AGAINST</div>
                            </button>
                        </div>
                    </div>
                );
            }

            if (screen === 'results') {
                const winnerGender = winner === 1 ? gender1 : gender2;
                const winnerPersonality = winner === 1 ? personality1 : personality2;
                const winnerName = winner === 1 ? (name1 || PERSONALITY_NAMES[personality1][gender1]) : (name2 || PERSONALITY_NAMES[personality2][gender2]);

                return (
                    <div className="results-container">
                        <div className="winner-announcement">
                            <div className="winner-title">🏆 Winner: {winnerName}</div>
                            <div className="winner-personality">{winnerPersonality}</div>
                            <div className="winner-position">{winner === 1 ? 'FOR' : 'AGAINST'}</div>
                        </div>
                        <button onClick={resetDebate}>New Debate</button>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
